<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
// ===== characters.js =====

// ---------------------------------------------------------------- helpers
const chr_UP = new THREE.Vector3(0, 1, 0);
const chr_ZERO = new THREE.Vector3();
function chr_clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function chr_smooth(e0, e1, x) { const t = chr_clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function chr_damp(cur, target, k, dt) { return cur + (target - cur) * (1 - Math.exp(-k * dt)); }
function chr_hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

let chr_fuzzTex = null;
function chr_getFuzz() {
  if (chr_fuzzTex) return chr_fuzzTex;
  const N = 256, h = new Float32Array(N * N);
  const octs = [[8, 0.5], [16, 0.35], [32, 0.25], [64, 0.18], [128, 0.12]];
  for (let o = 0; o < octs.length; o++) {
    const [f, amp] = octs[o];
    const g = new Float32Array(f * f);
    for (let i = 0; i < g.length; i++) g[i] = chr_hash(i * 1.37 + o * 91.7);
    const at = (a, b) => g[(((b % f) + f) % f) * f + (((a % f) + f) % f)];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const fx = x * f / N, fy = y * f / N, x0 = Math.floor(fx), y0 = Math.floor(fy);
      let tx = fx - x0, ty = fy - y0; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
      const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
      h[y * N + x] += amp * (a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty);
    }
  }
  const data = new Uint8Array(N * N * 4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = h[y * N + ((x + 1) % N)] - h[y * N + ((x - 1 + N) % N)];
    const dy = h[((y + 1) % N) * N + x] - h[((y - 1 + N) % N) * N + x];
    const n = new THREE.Vector3(-dx * 3, -dy * 3, 1).normalize();
    const i = (y * N + x) * 4;
    data[i] = (n.x * 0.5 + 0.5) * 255; data[i + 1] = (n.y * 0.5 + 0.5) * 255; data[i + 2] = (n.z * 0.5 + 0.5) * 255; data[i + 3] = 255;
  }
  const t = new THREE.DataTexture(data, N, N);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 5);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  t.needsUpdate = true;
  chr_fuzzTex = t;
  return t;
}

function chr_weldNormals(g) {
  const p = g.attributes.position, n = g.attributes.normal, map = new Map();
  const key = i => `${Math.round(p.getX(i) * 1e4)}_${Math.round(p.getY(i) * 1e4)}_${Math.round(p.getZ(i) * 1e4)}`;
  for (let i = 0; i < p.count; i++) {
    const k = key(i); let s = map.get(k);
    if (!s) { s = [0, 0, 0]; map.set(k, s); }
    s[0] += n.getX(i); s[1] += n.getY(i); s[2] += n.getZ(i);
  }
  for (let i = 0; i < p.count; i++) {
    const s = map.get(key(i)); const l = Math.hypot(s[0], s[1], s[2]) || 1;
    n.setXYZ(i, s[0] / l, s[1] / l, s[2] / l);
  }
}
function chr_sphereGeo(ws, hs, fn) {
  const g = new THREE.SphereGeometry(1, ws, hs);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); fn(v); p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); chr_weldNormals(g); g.computeBoundingSphere(); g.computeBoundingBox();
  return g;
}
function chr_superFn(rx, ry, rz, pw, extra) {
  return v => {
    const k = Math.pow(Math.pow(Math.abs(v.x), pw) + Math.pow(Math.abs(v.y), pw) + Math.pow(Math.abs(v.z), pw), -1 / pw);
    v.multiplyScalar(k); v.x *= rx; v.y *= ry; v.z *= rz;
    if (extra) extra(v);
  };
}
function chr_ellGeo(rx, ry, rz, ws = 48, hs = 36) { return chr_sphereGeo(ws, hs, v => { v.x *= rx; v.y *= ry; v.z *= rz; }); }

const chr_ray = new THREE.Raycaster();
function chr_hit(mesh, o, d) {
  mesh.updateMatrixWorld(true);
  chr_ray.set(o, d.clone().normalize());
  const h = chr_ray.intersectObject(mesh, false)[0];
  if (!h) return null;
  return { p: h.point.clone(), n: h.face.normal.clone().transformDirection(mesh.matrixWorld) };
}
function chr_hitFront(mesh, x, y) { return chr_hit(mesh, new THREE.Vector3(x, y, 3), new THREE.Vector3(0, 0, -1)); }
function chr_orient(obj, n) { obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(n, chr_ZERO, chr_UP)); }

function chr_taperTube(points, r0, r1, seg = 32, rs = 10) {
  const curve = new THREE.CatmullRomCurve3(points);
  const g = new THREE.TubeGeometry(curve, seg, 1, rs, false);
  const p = g.attributes.position, c = new THREE.Vector3(), v = new THREE.Vector3();
  for (let i = 0; i <= seg; i++) {
    const t = i / seg; curve.getPointAt(t, c);
    let r = r0 + (r1 - r0) * t;
    r *= Math.sqrt(chr_smooth(0, 0.12, 1 - t)) * 0.9 + 0.1;
    r *= Math.sqrt(chr_smooth(0, 0.06, t)) * 0.7 + 0.3;
    for (let j = 0; j <= rs; j++) { const k = i * (rs + 1) + j; v.fromBufferAttribute(p, k).sub(c).multiplyScalar(r).add(c); p.setXYZ(k, v.x, v.y, v.z); }
  }
  g.computeBoundingSphere();
  return g;
}

function chr_furMat(color, sheenColor, extra = {}) {
  return new THREE.MeshPhysicalMaterial({
    color, roughness: 0.85, sheen: 1, sheenRoughness: 0.42, sheenColor: new THREE.Color(sheenColor),
    normalMap: chr_getFuzz(), normalScale: new THREE.Vector2(0.28, 0.28), ...extra
  });
}
function chr_addBlush(mat, a, b, color, radius) {
  const u = { uBlush: { value: 0.4 }, uCheekA: { value: a }, uCheekB: { value: b }, uBlushCol: { value: new THREE.Color(color) }, uBlushR: { value: radius } };
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    sh.vertexShader = 'varying vec3 vChrP;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvChrP = position;');
    sh.fragmentShader = 'varying vec3 vChrP;\nuniform float uBlush; uniform vec3 uCheekA; uniform vec3 uCheekB; uniform vec3 uBlushCol; uniform float uBlushR;\n' +
      sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      { vec3 sA=(vChrP-uCheekA)*vec3(1.0,1.45,1.0); vec3 sB=(vChrP-uCheekB)*vec3(1.0,1.45,1.0);
        float r2=uBlushR*uBlushR; float b=exp(-dot(sA,sA)/r2)+exp(-dot(sB,sB)/r2);
        diffuseColor.rgb=mix(diffuseColor.rgb,uBlushCol,clamp(b*uBlush,0.0,0.8)); }`);
  };
  mat.customProgramCacheKey = () => 'chr_blush';
  return u;
}

function chr_canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8;
  return t;
}
function chr_lathe(pts, segs = 96, samples = 80, phiStart = 0, phiLen = Math.PI * 2) {
  const sp = new THREE.SplineCurve(pts.map(p => new THREE.Vector2(p[0], p[1]))).getSpacedPoints(samples);
  return new THREE.LatheGeometry(sp, segs, phiStart, phiLen);
}
function chr_mesh(geo, mat, parent, cast = true) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

// bow lobe: from knot (x=0) outward to x=L, pinched at knot, blunt rounded outer edge, satin folds
function chr_bowLobeGeo(L, H, D) {
  return chr_sphereGeo(64, 48, v => {
    const t = (v.x + 1) / 2, rho = Math.hypot(v.y, v.z);
    if (rho < 1e-6) { v.set(t * L, 0, 0); return; }
    const dy = v.y / rho, dz = v.z / rho, ang = Math.atan2(dz, dy);
    const prof = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(2 * t - 1), 3)), 1 / 3);
    let R = prof * (0.32 + 0.68 * chr_smooth(0, 0.85, t));
    R *= 1 + 0.07 * Math.sin(ang * 3 + 0.5) * chr_smooth(0.25, 1, t);
    const crease = 1 - 0.28 * Math.exp(-dy * dy * 9) * chr_smooth(0.1, 0.9, t);
    v.set(t * L, dy * R * H * 0.5 * (1 - 0.1 * Math.abs(dz)), dz * R * D * 0.5 * crease);
  });
}
function chr_buildBow(parent, size, mat) {
  const g = new THREE.Group(); parent.add(g);
  const lobe = chr_bowLobeGeo(0.26 * size, 0.27 * size, 0.15 * size);
  const r = chr_mesh(lobe, mat, g); r.rotation.set(0, -0.12, 0.12);
  const l = chr_mesh(lobe, mat, g); l.scale.x = -1; l.rotation.set(0, 0.12, -0.12);
  const knot = chr_mesh(chr_sphereGeo(40, 30, chr_superFn(0.07 * size, 0.085 * size, 0.07 * size, 2.4)), mat, g);
  knot.position.z = 0.03 * size;
  return g;
}

// eye: oval with highlight + happy (^) and closed (u) arcs
const chr_eyeMat = new THREE.MeshPhysicalMaterial({ color: '#100c14', roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.04, metalness: 0 });
const chr_hlMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });
const chr_lineMat = new THREE.MeshPhysicalMaterial({ color: '#1a1416', roughness: 0.45, clearcoat: 0.4 });
function chr_buildEye(rx, ry, rz, eyeMat = chr_eyeMat) {
  const g = new THREE.Group();
  const sc = new THREE.Group(); g.add(sc);
  chr_mesh(chr_ellGeo(rx, ry, rz), eyeMat, sc, false);
  const hl = chr_mesh(chr_ellGeo(rx * 0.26, ry * 0.2, rz * 0.4, 16, 12), chr_hlMat, sc, false);
  hl.position.set(rx * 0.32, ry * 0.42, rz * 0.82);
  const hl2 = chr_mesh(chr_ellGeo(rx * 0.12, ry * 0.09, rz * 0.3, 12, 10), chr_hlMat, sc, false);
  hl2.position.set(-rx * 0.3, -ry * 0.45, rz * 0.82);
  const arcPts = (sgn) => { const a = []; for (let i = 0; i <= 12; i++) { const th = Math.PI * i / 12; a.push(new THREE.Vector3(Math.cos(th) * rx * 1.25, sgn * (Math.sin(th) * ry * 0.42 - ry * 0.12), rz * 0.55)); } return a; };
  const happy = new THREE.Group(); g.add(happy);
  chr_mesh(chr_taperTube(arcPts(1), rx * 0.24, rx * 0.24, 32, 8), chr_lineMat, happy, false);
  const closed = new THREE.Group(); g.add(closed);
  chr_mesh(chr_taperTube(arcPts(-1).map(p => p.add(new THREE.Vector3(0, -ry * 0.1, 0))), rx * 0.22, rx * 0.22, 32, 8), chr_lineMat, closed, false);
  return { g, sc, happy, closed };
}

function chr_spring() { return { x: 0, v: 0 }; }
function chr_springStep(s, target, k, c, force, dt) {
  const a = k * (target - s.x) - c * s.v + force;
  s.v += a * dt; s.x += s.v * dt;
  s.x = chr_clamp(s.x, -1.2, 1.2);
}
function chr_probe(obj) { return { obj, p: null, v: new THREE.Vector3(), a: new THREE.Vector3(), la: new THREE.Vector3(), tmp: new THREE.Vector3(), q: new THREE.Quaternion() }; }
function chr_probeUpdate(pr, dt) {
  pr.obj.getWorldPosition(pr.tmp);
  if (!pr.p || pr.tmp.distanceTo(pr.p) > 1.0) { pr.p = pr.tmp.clone(); pr.v.set(0, 0, 0); pr.a.set(0, 0, 0); pr.la.set(0, 0, 0); return; }
  const nv = pr.tmp.clone().sub(pr.p).divideScalar(dt);
  const na = nv.clone().sub(pr.v).divideScalar(dt);
  if (na.length() > 40) na.setLength(40);
  pr.a.lerp(na, 1 - Math.exp(-dt * 30));
  pr.v.copy(nv); pr.p.copy(pr.tmp);
  pr.obj.getWorldQuaternion(pr.q);
  pr.la.copy(pr.a).applyQuaternion(pr.q.invert());
}

const chr_DEF = {
  armL: 0.15, armR: 0.15, armLFwd: 0, armRFwd: 0, walk: 0, lean: 0, bend: 0, squash: 1,
  headTilt: 0, headTurn: 0, headNod: 0, happyEyes: 0, eyesClosed: 0, surprised: 0, blush: 0.4,
  talk: 0, tiptoe: 0, dizzy: 0, sad: 0, determined: 0
};

// ---------------------------------------------------------------- shared body
function chr_buildBase(o) {
  const root = new THREE.Group(); root.name = o.name;
  const squashG = new THREE.Group(); root.add(squashG);
  const leanG = new THREE.Group(); squashG.add(leanG);
  const HIP = 0.42;
  const torso = new THREE.Group(); torso.position.y = HIP; leanG.add(torso);
  const body = new THREE.Group(); body.position.y = -HIP; torso.add(body);

  // dress (pivot near chest so the hem sways)
  const DP = 0.86;
  const dressG = new THREE.Group(); dressG.position.y = DP; body.add(dressG);
  const dressInner = new THREE.Group(); dressInner.position.y = -DP; dressG.add(dressInner);
  const dress = chr_mesh(chr_lathe(o.dressProfile), o.dressMat, dressInner);
  // hem trim
  const hem = chr_mesh(new THREE.TorusGeometry(o.hemR, 0.026, 16, 128), o.trimMat, dressInner);
  hem.rotation.x = Math.PI / 2; hem.position.y = o.hemY;

  // neck/collar
  const neck = new THREE.Group(); neck.position.y = 0.95; body.add(neck);
  const headG = new THREE.Group(); headG.rotation.order = 'YXZ'; headG.position.y = o.headY - 0.95; neck.add(headG);

  // arms
  const arms = [];
  for (const s of [1, -1]) {
    const sh = new THREE.Group(); sh.position.set(s * 0.235, 0.84, 0.0); body.add(sh);
    const raise = new THREE.Group(); sh.add(raise);
    const fwd = new THREE.Group(); raise.add(fwd);
    const sleeve = chr_mesh(chr_sphereGeo(40, 30, chr_superFn(0.105, 0.1, 0.1, 2.2)), o.sleeveMat, fwd);
    sleeve.position.y = -0.04;
    const arm = chr_mesh(new THREE.CapsuleGeometry(0.068, 0.2, 12, 32), o.furMat, fwd);
    arm.position.y = -0.17;
    const paw = chr_mesh(chr_ellGeo(0.084, 0.088, 0.08, 40, 30), o.furMat, fwd);
    paw.position.y = -0.3;
    const hand = new THREE.Object3D(); hand.position.y = -0.37; fwd.add(hand);
    arms.push({ s, sh, raise, fwd, hand });
  }
  // legs + feet
  const legs = [];
  for (const s of [1, -1]) {
    const leg = chr_mesh(new THREE.CapsuleGeometry(0.075, 1, 8, 24), o.furMat, leanG);
    const ankle = new THREE.Group(); leanG.add(ankle);
    const foot = chr_mesh(chr_sphereGeo(48, 36, chr_superFn(0.105, 0.078, 0.145, 2.3, v => { if (v.y < -0.03) v.y = -0.03 + (v.y + 0.03) * 0.6; })), o.furMat, ankle);
    foot.position.set(0, -0.005, 0.045);
    legs.push({ s, leg, ankle });
  }
  return { root, squashG, leanG, torso, body, dressG, dress, neck, headG, arms, legs, HIP };
}

function chr_makeRig(base, extra) {
  const { root, squashG, leanG, torso, body, dressG, headG, arms, legs, HIP } = base;
  const st = { ...chr_DEF };
  const rates = { armL: 9, armR: 9, armLFwd: 9, armRFwd: 9, happyEyes: 12, eyesClosed: 10, surprised: 12, blush: 4, walk: 6 };
  const dress = { p: chr_spring(), r: chr_spring() };
  const hipProbe = chr_probe(torso);
  let blinkSeed = extra.seed || 1;
  let first = true;

  function blinkAt(t) {
    const cell = 3.4, k = Math.floor(t / cell), off = 0.4 + chr_hash(k * 13.1 + blinkSeed) * 2.4;
    let b = 0;
    const tri = (x) => { const d = 0.17; return x < 0 || x > d ? 0 : Math.sin(Math.PI * x / d); };
    b = tri(t - k * cell - off);
    if (chr_hash(k * 7.7 + blinkSeed * 3) > 0.7) b = Math.max(b, tri(t - k * cell - off - 0.26));
    return b;
  }

  function update(t, dt, pose) {
    pose = pose || {};
    dt = chr_clamp(dt || 1 / 60, 1e-4, 0.1);
    for (const k in st) {
      const tgt = pose[k] !== undefined ? pose[k] : chr_DEF[k];
      st[k] = first ? tgt : chr_damp(st[k], tgt, rates[k] || 8, dt);
    }
    first = false;
    const ph = pose.walkPhase || 0, W = st.walk;
    const sad = st.sad, det = st.determined;

    // body
    const s = Math.max(0.3, st.squash);
    squashG.scale.set(1 / Math.sqrt(s), s, 1 / Math.sqrt(s));
    const dz = st.dizzy, dzT = t * 5.5;
    leanG.rotation.z = -st.lean + Math.sin(ph) * 0.045 * W + Math.sin(dzT) * 0.05 * dz + Math.sin(t * 1.3) * 0.01;
    leanG.rotation.x = Math.cos(dzT) * 0.035 * dz;
    const bob = Math.abs(Math.cos(ph)) * 0.035 * W;
    const rise = st.tiptoe * 0.06;
    const breath = Math.sin(t * 2.1);
    torso.position.y = HIP + bob + rise - sad * 0.015;
    torso.rotation.x = st.bend + 0.04 * W + sad * 0.12 + det * 0.06;
    torso.rotation.y = Math.sin(ph) * 0.08 * W;
    torso.scale.set(1 + breath * 0.006 + det * 0.02, 1 + breath * 0.008, 1 + breath * 0.006 + det * 0.03);

    // head
    const talkO = (Math.sin(t * 13) * 0.6 + Math.sin(t * 7.3 + 1) * 0.4) * st.talk;
    headG.rotation.y = st.headTurn + Math.sin(t * 0.7) * 0.02;
    headG.rotation.x = st.headNod + talkO * 0.05 + Math.cos(dzT) * 0.13 * dz + sad * 0.32 - det * 0.12 - Math.sin(ph * 2) * 0.02 * W - breath * 0.008 - st.bend * 0.3;
    headG.rotation.z = -st.headTilt + Math.sin(dzT) * 0.2 * dz + Math.sin(t * 0.9) * 0.015;
    headG.scale.y = 1 + Math.abs(talkO) * 0.025;

    // arms
    for (const a of arms) {
      const L = a.s > 0;
      let r = L ? st.armL : st.armR;
      let f = L ? st.armLFwd : st.armRFwd;
      f += (L ? -1 : 1) * Math.sin(ph) * 0.45 * W;
      r = r * (1 - sad * 0.6) + det * 0.2;
      f -= det * 0.35;
      r += Math.sin(t * 2.1 + (L ? 0 : 1)) * 0.02;
      const HALF = Math.PI / 2;
      const eff = r <= HALF ? r + 0.22 * Math.cos(chr_clamp(r, 0, Math.PI) / 2) : HALF + 0.22 * Math.cos(HALF / 2) * (1 - (r - HALF) / HALF) + (r - HALF) * 0.42;
      if (r > HALF) f += (r - HALF) * 0.25;
      a.raise.rotation.z = a.s * eff;
      a.fwd.rotation.x = -f;
      a.sh.position.y = 0.84 - sad * 0.03;
    }

    // legs
    const ankleY = 0.082;
    for (const lg of legs) {
      const L = lg.s > 0;
      const sw = L ? Math.sin(ph) : -Math.sin(ph);
      const lift = Math.max(0, L ? Math.cos(ph) : -Math.cos(ph)) * 0.07 * W;
      const ax = lg.s * 0.12, az = sw * 0.15 * W + 0.01;
      const ay = ankleY + lift + st.tiptoe * 0.065;
      lg.ankle.position.set(ax, ay, az);
      lg.ankle.rotation.x = st.tiptoe * 0.75 + (L ? -Math.cos(ph) : Math.cos(ph)) * 0.18 * W;
      const hip = new THREE.Vector3(lg.s * 0.11, torso.position.y - 0.06, 0.0);
      const an = new THREE.Vector3(ax, ay + 0.02, az - 0.01);
      const d = an.clone().sub(hip); const len = d.length();
      lg.leg.position.copy(hip).add(an).multiplyScalar(0.5);
      lg.leg.quaternion.setFromUnitVectors(chr_UP, d.normalize());
      lg.leg.scale.set(1, len / 1.15, 1);
    }

    // eyes
    const blink = blinkAt(t);
    const close = Math.max(blink, st.eyesClosed, st.happyEyes);
    const open = 1 - close;
    const sur = 1 + st.surprised * 0.22;
    for (const e of extra.eyes) {
      const vy = Math.max(0.06, open) * sur * (1 - det * 0.25 - sad * 0.18);
      e.sc.scale.set(sur, vy, 1);
      e.sc.position.y = -sad * 0.008;
      e.sc.visible = open > 0.12;
      const hw = st.happyEyes >= Math.max(blink, st.eyesClosed) ? 1 : 0;
      const arcAmt = chr_smooth(0.75, 1, close);
      e.happy.visible = !!hw && arcAmt > 0.01; e.happy.scale.set(1, Math.max(0.01, arcAmt), 1);
      e.closed.visible = !hw && arcAmt > 0.01; e.closed.scale.set(1, Math.max(0.01, arcAmt), 1);
    }
    extra.blushU.uBlush.value = st.blush * (1 - sad * 0.5);
    if (extra.post) extra.post(t, dt, pose, st, ph, W);

    root.updateMatrixWorld(true);
    // secondary motion
    hipProbe.obj = torso;
    chr_probeUpdate(hipProbe, dt);
    extra.probe && chr_probeUpdate(extra.probe, dt);
    const n = Math.max(1, Math.ceil(dt / (1 / 120))), sdt = dt / n;
    const la = hipProbe.la;
    for (let i = 0; i < n; i++) {
      chr_springStep(dress.p, 0, 90, 7, la.z * 1.3 + Math.cos(ph) * 0 , sdt);
      chr_springStep(dress.r, 0, 90, 7, -la.x * 1.3, sdt);
    }
    dressG.rotation.x = chr_clamp(dress.p.x, -0.15, 0.15);
    dressG.rotation.z = chr_clamp(dress.r.x, -0.15, 0.15) + Math.sin(ph) * 0.02 * W;
    extra.secondary(t, dt, st, n, sdt);
    root.updateMatrixWorld(true);
  }
  return { update, st };
}

// ---------------------------------------------------------------- Hello Kitty
function createKitty() {
  const fur = chr_furMat('#fbf7f2', '#fff1f4');
  const headMat = chr_furMat('#fbf7f2', '#fff1f4');
  const pinkDots = chr_canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = '#ff86b1'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#fff8fb';
    const dot = (x, y) => { for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) { c.beginPath(); c.arc(x + ox, y + oy, 30, 0, Math.PI * 2); c.fill(); } };
    dot(64, 64); dot(192, 192);
  }, 9, 3);
  const dressMat = new THREE.MeshPhysicalMaterial({ map: pinkDots, roughness: 0.75, sheen: 1, sheenRoughness: 0.45, sheenColor: new THREE.Color('#ffd0e2'), normalMap: chr_getFuzz(), normalScale: new THREE.Vector2(0.15, 0.15) });
  const sleeveMat = new THREE.MeshPhysicalMaterial({ color: '#ff86b1', roughness: 0.75, sheen: 1, sheenRoughness: 0.45, sheenColor: new THREE.Color('#ffd0e2') });
  const trimMat = chr_furMat('#fffafc', '#ffffff');
  const base = chr_buildBase({
    name: 'HelloKitty', furMat: fur, dressMat, sleeveMat, trimMat, headY: 1.43, hemR: 0.385, hemY: 0.285,
    dressProfile: [[0.0, 0.25], [0.22, 0.25], [0.34, 0.26], [0.395, 0.3], [0.385, 0.36], [0.33, 0.52], [0.28, 0.68], [0.245, 0.8], [0.215, 0.9], [0.14, 0.98], [0.0, 1.0]]
  });
  const H = base.headG;

  // head
  const head = chr_mesh(chr_sphereGeo(128, 96, chr_superFn(0.625, 0.475, 0.465, 2.35, v => {
    if (v.y < 0) v.x *= 1 + 0.035 * (-v.y / 0.475);
    if (v.z > 0) v.z *= 1 + 0.05 * Math.exp(-(v.x * v.x * 8 + (v.y + 0.08) * (v.y + 0.08) * 10));
  })), headMat, null);
  // features (raycast before parenting)
  const eyes = [];
  for (const s of [1, -1]) {
    const h = chr_hitFront(head, s * 0.27, -0.035);
    const e = chr_buildEye(0.05, 0.072, 0.026);
    e.g.position.copy(h.p).addScaledVector(h.n, -0.006); chr_orient(e.g, h.n);
    H.add(e.g); eyes.push(e);
  }
  const nh = chr_hitFront(head, 0, -0.115);
  const noseMat = new THREE.MeshPhysicalMaterial({ color: '#ffc21c', roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1, sheen: 0.5, sheenColor: new THREE.Color('#fff2a0') });
  const nose = chr_mesh(chr_sphereGeo(40, 30, chr_superFn(0.056, 0.038, 0.032, 2.2)), noseMat, H);
  nose.position.copy(nh.p).addScaledVector(nh.n, -0.005); chr_orient(nose, nh.n);
  // whiskers: 3 per side, embroidered over the cheek then free beyond the silhouette
  const whiskG = [];
  const whiskMat = new THREE.MeshPhysicalMaterial({ color: '#2a2224', roughness: 0.5 });
  for (const s of [1, -1]) {
    const wg = new THREE.Group(); H.add(wg); whiskG.push(wg);
    wg.position.set(s * 0.45, -0.1, 0.3);
    const rows = [[-0.035, 0.05], [-0.095, -0.075], [-0.155, -0.2]];
    for (const [y0, y1] of rows) {
      const pts = [];
      let lastZ = 0;
      for (let i = 0; i <= 8; i++) {
        const f = i / 8, x = s * (0.42 + 0.42 * f), y = y0 + (y1 - y0) * f + Math.sin(f * Math.PI) * 0.012;
        const hh = chr_hitFront(head, x, y);
        let z = hh ? hh.p.z + 0.012 : lastZ - 0.05;
        if (!hh && i > 0) z = Math.max(lastZ - 0.06, -0.05);
        lastZ = z;
        pts.push(new THREE.Vector3(x, y, z).sub(wg.position));
      }
      const wm = chr_mesh(chr_taperTube(pts, 0.0095, 0.004, 48, 8), whiskMat, wg, false);
    }
  }
  // cheeks
  const cA = chr_hitFront(head, 0.38, -0.15).p, cB = chr_hitFront(head, -0.38, -0.15).p;
  const blushU = chr_addBlush(headMat, cA, cB, '#ff8eaa', 0.085);
  H.add(head);

  // ears
  const earGeo = chr_sphereGeo(56, 44, v => {
    const t = (v.y + 1) / 2, tp = 1 - 0.62 * Math.pow(t, 1.2);
    v.x *= 0.19 * tp; v.z *= 0.1 * tp; v.y = t * 0.36;
    v.z += 0.03 * Math.sin(t * Math.PI);
  });
  const ears = [];
  for (const s of [1, -1]) {
    const e = chr_mesh(earGeo, headMat, H);
    e.position.set(s * 0.37, 0.27, -0.04); e.rotation.set(-0.08, 0, -s * 0.52);
    const tip = new THREE.Object3D(); tip.position.y = 0.34; e.add(tip);
    const mid = new THREE.Object3D(); mid.position.y = 0.17; e.add(mid);
    ears.push({ e, tip, mid });
  }
  // bow on her left ear (+X)
  const satin = new THREE.MeshPhysicalMaterial({ color: '#e5122f', roughness: 0.38, sheen: 1, sheenRoughness: 0.3, sheenColor: new THREE.Color('#ff5a74'), clearcoat: 0.55, clearcoatRoughness: 0.25 });
  const bowPivot = new THREE.Group(); bowPivot.position.set(0.34, 0.4, 0.15); bowPivot.rotation.set(-0.15, 0.32, -0.38); H.add(bowPivot);
  const bowJ = new THREE.Group(); bowPivot.add(bowJ);
  chr_buildBow(bowJ, 1.22, satin);
  const bowA = new THREE.Object3D(); bowA.position.z = 0.06; bowJ.add(bowA);

  const headTop = new THREE.Object3D(); headTop.position.set(0, 0.475, 0); H.add(headTop);
  const face = new THREE.Object3D(); face.position.set(0, -0.05, 0.47); H.add(face);

  // collar
  const collarMat = trimMat;
  for (const s of [1, -1]) {
    const c = chr_mesh(chr_sphereGeo(40, 30, chr_superFn(0.11, 0.035, 0.075, 2.2)), collarMat, base.body);
    c.position.set(s * 0.085, 0.935, 0.17); c.rotation.set(0.35, s * 0.4, -s * 0.25);
  }

  const bowS = { r: chr_spring(), p: chr_spring() };
  const whS = chr_spring();
  const probe = chr_probe(bowA);
  const rig = chr_makeRig(base, {
    eyes, blushU, seed: 3, probe,
    secondary(t, dt, st, n, sdt) {
      const la = probe.la;
      for (let i = 0; i < n; i++) {
        chr_springStep(bowS.r, -st.sad * 0.25, 160, 7, la.x * 2.6, sdt);
        chr_springStep(bowS.p, st.sad * 0.15, 160, 7, -la.z * 2.2 - la.y * 1.2, sdt);
        chr_springStep(whS, 0, 260, 6, la.y * 1.5, sdt);
      }
      bowJ.rotation.z = bowS.r.x; bowJ.rotation.x = -bowS.p.x;
      whiskG[0].rotation.z = whS.x * 0.4; whiskG[1].rotation.z = -whS.x * 0.4;
    }
  });
  return {
    root: base.root,
    anchors: { handL: base.arms[0].hand, handR: base.arms[1].hand, headTop, bow: bowA, earTipL: ears[0].tip, earTipR: ears[1].tip, earMidL: ears[0].mid, earMidR: ears[1].mid, face },
    update: rig.update
  };
}

// ---------------------------------------------------------------- My Melody
function chr_buildLongEar(L, W, D, mat, innerMat) {
  const g = chr_sphereGeo(40, 64, v => {
    const t = (v.y + 1) / 2;
    const w = 0.6 + 0.4 * Math.sin(Math.PI * Math.min(1, t * 1.1) * 0.85 + 0.15);
    v.x *= W * 0.5 * w; v.z *= D * 0.5 * w; v.y = t * L;
  });
  const gi = chr_sphereGeo(32, 48, v => {
    const t = (v.y + 1) / 2;
    const w = 0.55 + 0.45 * Math.sin(Math.PI * t * 0.9 + 0.1);
    v.x *= W * 0.34 * w; v.z = v.z * D * 0.12 * w + D * 0.36 * w; v.y = (0.1 + t * 0.78) * L;
  });
  const grp = new THREE.Group();
  const outer = chr_mesh(g, mat, grp);
  const inner = chr_mesh(gi, innerMat, grp, false);
  const meshes = [outer, inner].map(m => ({ m, P: m.geometry.attributes.position.array.slice(), N: m.geometry.attributes.normal.array.slice() }));
  const tip = new THREE.Object3D(), mid = new THREE.Object3D(); grp.add(tip, mid);
  const NS = 24, sp = [], sq = [];
  for (let i = 0; i <= NS; i++) { sp.push(new THREE.Vector3()); sq.push([0, 0]); }
  function rot(ax, az, x, y, z, out) {
    const ca = Math.cos(ax), sa = Math.sin(ax), y1 = y * ca - z * sa, z1 = y * sa + z * ca;
    const cz = Math.cos(az), sz = Math.sin(az);
    out[0] = x * cz - y1 * sz; out[1] = x * sz + y1 * cz; out[2] = z1;
  }
  const o = [0, 0, 0];
  function bend(ax, az) {
    sp[0].set(0, 0, 0);
    for (let i = 1; i <= NS; i++) {
      const sm = (i - 0.5) / NS, k = sm * sm;
      rot(ax * k, az * k, 0, L / NS, 0, o);
      sp[i].set(sp[i - 1].x + o[0], sp[i - 1].y + o[1], sp[i - 1].z + o[2]);
    }
    for (const { m, P, N } of meshes) {
      const pa = m.geometry.attributes.position, na = m.geometry.attributes.normal;
      const pv = pa.array, nv = na.array;
      for (let i = 0; i < pv.length; i += 3) {
        const s = chr_clamp(P[i + 1] / L, 0, 1), fi = s * NS, i0 = Math.min(NS - 1, Math.floor(fi)), f = fi - i0;
        const k = s * s;
        const bx = sp[i0].x + (sp[i0 + 1].x - sp[i0].x) * f, by = sp[i0].y + (sp[i0 + 1].y - sp[i0].y) * f, bz = sp[i0].z + (sp[i0 + 1].z - sp[i0].z) * f;
        const extra = P[i + 1] - s * L;
        rot(ax * k, az * k, P[i], extra, P[i + 2], o);
        pv[i] = bx + o[0]; pv[i + 1] = by + o[1]; pv[i + 2] = bz + o[2];
        rot(ax * k, az * k, N[i], N[i + 1], N[i + 2], o);
        nv[i] = o[0]; nv[i + 1] = o[1]; nv[i + 2] = o[2];
      }
      pa.needsUpdate = true; na.needsUpdate = true;
      m.geometry.computeBoundingSphere();
    }
    tip.position.copy(sp[NS]); mid.position.copy(sp[NS >> 1]);
  }
  bend(0, 0);
  return { grp, bend, tip, mid };
}

// ---------------------------------------------------------------- Cinnamoroll
function createCinnamoroll() {
  const fur = chr_furMat('#fdfbf8', '#eef4ff');
  const headMat = chr_furMat('#fdfbf8', '#eef4ff');
  const base = chr_buildBase({
    name: 'Cinnamoroll', furMat: fur, dressMat: fur, sleeveMat: fur, trimMat: fur, headY: 1.24, hemR: 0.05, hemY: 0.5,
    dressProfile: [[0.0, 0.2], [0.2, 0.205], [0.32, 0.25], [0.375, 0.38], [0.365, 0.55], [0.31, 0.72], [0.22, 0.86], [0.12, 0.94], [0.0, 0.96]]
  });
  const H = base.headG;
  const head = chr_mesh(chr_sphereGeo(128, 96, chr_superFn(0.58, 0.45, 0.47, 2.1, v => {
    if (v.y < 0) v.x *= 1 + 0.06 * (-v.y / 0.45);
    if (v.z > 0) v.z *= 1 + 0.05 * Math.exp(-(v.x * v.x * 6 + (v.y + 0.1) * (v.y + 0.1) * 8));
  })), headMat, null);
  const blueMat = new THREE.MeshPhysicalMaterial({ color: '#2d63cf', roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.03 });
  const eyes = [];
  for (const s of [1, -1]) {
    const h = chr_hitFront(head, s * 0.2, -0.03);
    const e = chr_buildEye(0.062, 0.078, 0.028, blueMat);
    e.g.position.copy(h.p).addScaledVector(h.n, -0.006); chr_orient(e.g, h.n);
    H.add(e.g); eyes.push(e);
  }
  // tiny smile mouth
  const mh = chr_hitFront(head, 0, -0.15);
  const mouthG = new THREE.Group(); mouthG.position.copy(mh.p); chr_orient(mouthG, mh.n); H.add(mouthG);
  const mpts = []; for (let i = 0; i <= 12; i++) { const a = Math.PI * (1 + i / 12); mpts.push(new THREE.Vector3(Math.cos(a) * 0.035, Math.sin(a) * 0.022 + 0.01, 0.006)); }
  chr_mesh(chr_taperTube(mpts, 0.0075, 0.0075, 32, 8), chr_lineMat, mouthG, false);
  const cA = chr_hitFront(head, 0.34, -0.12).p, cB = chr_hitFront(head, -0.34, -0.12).p;
  const blushU = chr_addBlush(headMat, cA, cB, '#ff9bb5', 0.09);
  H.add(head);

  // long wide floppy ears
  const ears = [];
  for (const s of [1, -1]) {
    const E = chr_buildLongEar(0.95, 0.4, 0.085, fur, chr_furMat('#fff6f8', '#ffffff'));
    const pivot = new THREE.Group(); pivot.position.set(s * 0.43, 0.24, 0.04); H.add(pivot);
    pivot.add(E.grp);
    ears.push({ s, E, pivot, p: chr_spring(), r: chr_spring() });
  }
  // cinnamon-roll tail
  const tailG = new THREE.Group(); tailG.position.set(0, 0.52, -0.33); base.body.add(tailG);
  const tpts = []; for (let i = 0; i <= 60; i++) { const f = i / 60, a = f * Math.PI * 3.2, r = 0.13 * (1 - f * 0.85); tpts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r + 0.02, -0.02 - f * 0.05)); }
  chr_mesh(chr_taperTube(tpts, 0.06, 0.03, 120, 16), fur, tailG);
  const tail = new THREE.Object3D(); tail.position.set(0, 0.02, -0.08); tailG.add(tail);

  const headTop = new THREE.Object3D(); headTop.position.set(0, 0.45, 0); H.add(headTop);
  const face = new THREE.Object3D(); face.position.set(0, -0.06, 0.49); H.add(face);

  const ex = { fly: 0, smug: 0, sorry: 0 };
  const probe = chr_probe(headTop);
  const rig = chr_makeRig(base, {
    eyes, blushU, seed: 11, probe,
    post(t, dt, pose, st) {
      for (const k in ex) ex[k] = chr_damp(ex[k], pose[k] || 0, 8, dt);
      const { fly, smug, sorry } = ex;
      const mix = (a, b, f) => a + (b - a) * f;
      // fly: hover bob, forward tilt, dangling feet, arms out
      base.squashG.position.y = Math.sin(t * 2.6) * 0.04 * fly;
      base.leanG.rotation.x += 0.22 * fly;
      base.leanG.rotation.z += Math.sin(t * 2) * 0.05 * sorry;
      for (const lg of base.legs) lg.ankle.rotation.x += (0.7 + Math.sin(t * 3 + lg.s) * 0.15) * fly;
      for (const a of base.arms) {
        a.raise.rotation.z = mix(a.raise.rotation.z, a.s * 0.75, fly);
        a.raise.rotation.z = mix(a.raise.rotation.z, a.s * -0.32, sorry);
        a.fwd.rotation.x = mix(a.fwd.rotation.x, -1.2, sorry);
      }
      H.rotation.x += 0.35 * sorry - 0.22 * smug - 0.1 * fly;
      H.rotation.z += -0.12 * smug;
      for (const e of eyes) {
        e.sc.scale.y *= (1 - 0.5 * smug) * (1 - 0.2 * sorry);
        e.sc.position.y += -0.012 * sorry - 0.012 * smug;
      }
      mouthG.scale.set(1 + 0.5 * smug, 1 + 0.3 * smug - 0.4 * st.sad, 1);
      mouthG.rotation.z = 0.25 * smug;
      mouthG.children[0].rotation.x = 0;
    },
    secondary(t, dt, st, n, sdt) {
      const la = probe.la, fly = ex.fly;
      const flap = Math.sin(t * Math.PI * 2 * 3.5);
      for (const e of ears) {
        for (let i = 0; i < n; i++) {
          chr_springStep(e.p, 0.15 + st.sad * 0.2, 50, 4.5, -la.z * 2.5, sdt);
          chr_springStep(e.r, 0, 50, 4.5, la.x * 2.5 + la.y * 1.5 * e.s, sdt);
        }
        const restZ = -e.s * (Math.PI - 0.3 - st.happyEyes * 0.1 + st.sad * 0.15);
        const flyZ = -e.s * (Math.PI / 2 + 0.05 + flap * 0.55);
        e.pivot.rotation.set(0.05 * (1 - fly), 0.12 * e.s * (1 - fly), restZ + (flyZ - restZ) * fly);
        const flex = -Math.cos(t * Math.PI * 2 * 3.5) * 0.45 * fly * e.s;
        e.E.bend(e.p.x * (1 - fly), e.r.x + flex + e.s * 0.18 * (1 - fly));
      }
    }
  });
  return {
    root: base.root,
    anchors: { handL: base.arms[0].hand, handR: base.arms[1].hand, headTop, face, earTipL: ears[0].E.tip, earTipR: ears[1].E.tip, earMidL: ears[0].E.mid, earMidR: ears[1].E.mid, tail },
    update: rig.update
  };
}

// ===== environment.js =====


// ---------------------------------------------------------------- utils
function env_rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function env_hash2(ix, iy, seed) {
  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(seed | 0, 982451653);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function env_vnoise(x, y, seed = 0, period = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const w = (a) => (period ? ((a % period) + period) % period : a);
  const a = env_hash2(w(ix), w(iy), seed), b = env_hash2(w(ix + 1), w(iy), seed);
  const c = env_hash2(w(ix), w(iy + 1), seed), d = env_hash2(w(ix + 1), w(iy + 1), seed);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function env_fbm(x, y, oct = 4, seed = 0, period = 0) {
  let s = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    s += amp * env_vnoise(x * f, y * f, seed + i * 17, period ? period * f : 0);
    n += amp; amp *= 0.5; f *= 2;
  }
  return s / n;
}
function env_noise3(x, y, z, seed = 0) {
  return (env_vnoise(x + z * 0.71, y - z * 0.37, seed) + env_vnoise(y + 3.1, z + x * 0.53, seed + 9)) * 0.5;
}
const env_ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// Inverse of three.js ACES filmic so sky / fog colors land exactly on the intended display color.
const env_ACES_OUT = [[1.60475, -0.53108, -0.07367], [-0.10208, 1.10813, -0.00605], [-0.00327, -0.07276, 1.07602]];
const env_ACES_IN = [[0.59719, 0.35458, 0.04823], [0.07600, 0.90834, 0.01566], [0.02840, 0.13383, 0.83777]];
const env_inv3 = (m) => new THREE.Matrix3().set(...m[0], ...m[1], ...m[2]).invert();
const env_ACES_OUT_INV = env_inv3(env_ACES_OUT);
const env_ACES_IN_INV = env_inv3(env_ACES_IN);
function env_ac(hex, mul = 1) {
  const c = new THREE.Color(hex); // linear
  const v = new THREE.Vector3(Math.min(c.r * mul, 0.985), Math.min(c.g * mul, 0.985), Math.min(c.b * mul, 0.985));
  v.applyMatrix3(env_ACES_OUT_INV);
  const f = (y) => {
    y = Math.min(Math.max(y, 0.0001), 1.0);
    const A = 1 - 0.983729 * y, B = 0.0245786 - 0.432951 * y, C = -0.000090537 - 0.238081 * y;
    return (-B + Math.sqrt(B * B - 4 * A * C)) / (2 * A);
  };
  v.set(f(v.x), f(v.y), f(v.z)).applyMatrix3(env_ACES_IN_INV).multiplyScalar(0.6);
  return new THREE.Color(Math.max(v.x, 0), Math.max(v.y, 0), Math.max(v.z, 0));
}
// piecewise palette over sunset keys 0, 0.6, 1
function env_pal(keys, s, out) {
  const [a, b, c] = keys;
  if (s <= 0.6) return out.copy(a).lerp(b, s / 0.6);
  return out.copy(b).lerp(c, (s - 0.6) / 0.4);
}
const env_pal3 = (h0, h1, h2, conv) => [conv(h0), conv(h1), conv(h2)];
const env_lin = (h) => new THREE.Color(h);

// ---------------------------------------------------------------- terrain
function env_height(x, z) {
  const dx = Math.max(0, Math.abs(x) - 8), dzb = Math.max(0, -z - 5), dzf = Math.max(0, z - 8);
  const d = Math.sqrt(dx * dx + dzb * dzb + dzf * dzf);
  const near = env_ss(0, 6, d) * 0.18 * Math.sin(x * 0.45 + 1.3) * Math.cos(z * 0.38);
  const amp = 3.5 * env_ss(4, 60, d);
  const roll = (env_fbm(x * 0.022 + 3.7, z * 0.022 + 7.1, 3, 5) - 0.42) * 2;
  return near + amp * Math.max(roll, -0.15) + 0.03 * d * env_ss(20, 80, d);
}

// Puffy union-of-spheres with soft creases (trees, clouds, bush)
function env_puff(lobes, detail, k, opts = {}) {
  let g = new THREE.IcosahedronGeometry(1, detail);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const pos = g.attributes.position, n = pos.count;
  const col = new Float32Array(n * 3);
  const d = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    d.fromBufferAttribute(pos, i).normalize();
    let t1 = -1e9, t2 = -1e9; const ts = [];
    for (const L of lobes) {
      const b = d.x * L[0] + d.y * L[1] + d.z * L[2];
      const cc = L[0] * L[0] + L[1] * L[1] + L[2] * L[2];
      const disc = b * b - (cc - L[3] * L[3]);
      if (disc <= 0) continue;
      const t = b + Math.sqrt(disc);
      if (t <= 0) continue;
      ts.push(t);
      if (t > t1) { t2 = t1; t1 = t; } else if (t > t2) t2 = t;
    }
    let s = 0; for (const t of ts) s += Math.exp(k * (t - t1));
    let r = t1 + Math.log(s) / k;
    if (opts.lump) r *= 1 + opts.lump * (env_noise3(d.x * 3.5, d.y * 3.5, d.z * 3.5, 3) - 0.5);
    const p = d.clone().multiplyScalar(r);
    if (opts.flat !== undefined && p.y < opts.flat) p.y = opts.flat + (p.y - opts.flat) * 0.12;
    pos.setXYZ(i, p.x, p.y, p.z);
    const crease = t2 > -1e8 ? env_ss(0, opts.creaseW || 0.35, t1 - t2) : 1;
    let ao = (0.62 + 0.38 * crease) * (0.62 + 0.38 * env_ss(-0.7, 0.55, d.y));
    let tint = 1;
    if (opts.speck) tint = 1 + opts.speck * (env_noise3(d.x * 9, d.y * 9, d.z * 9, 11) - 0.5);
    col[i * 3] = ao * tint; col[i * 3 + 1] = ao * (opts.speckG ? 1 + (tint - 1) * opts.speckG : tint); col[i * 3 + 2] = ao * tint;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

// ---------------------------------------------------------------- shared wind
const env_windU = { uTime: { value: 0 }, uWind: { value: 1 } };
const env_windGLSL = /* glsl */`
uniform float uTime; uniform float uWind;
vec3 env_windOffset(vec3 wp, float h){
  float ph = dot(wp.xz, vec2(0.55, 0.31));
  float gust = sin(wp.x*0.16 + wp.z*0.09 - uTime*1.1)*0.5+0.5; gust *= gust;
  float s = sin(ph*2.0 - uTime*2.3)*0.5 + sin(ph*5.1 - uTime*3.9)*0.18;
  float amt = (0.18 + 0.75*gust) * uWind;
  return vec3(0.10 + 0.22*s, 0.0, 0.04 + 0.12*s) * amt * h * h;
}`;
function env_windMaterial(params, flower) {
  const m = new THREE.MeshStandardMaterial(params);
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = env_windU.uTime; sh.uniforms.uWind = env_windU.uWind;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + env_windGLSL + (flower ? '\nattribute float aFixed;' : ''))
      .replace('#include <begin_vertex>', `#include <begin_vertex>
#ifdef USE_INSTANCING
  vec3 env_ip = instanceMatrix[3].xyz;
  float env_hh = length(instanceMatrix[1].xyz);
  vec3 env_d = env_windOffset(env_ip, clamp(position.y,0.0,1.2)) * env_hh;
  env_d.y = -length(env_d.xz)*0.4;
  transformed += inverse(mat3(instanceMatrix)) * env_d;
#endif`);
    if (flower) {
      sh.vertexShader = sh.vertexShader.replace('#include <color_vertex>', `
  vColor = vec3(1.0);
  #ifdef USE_INSTANCING_COLOR
    vColor = mix(color.rgb * instanceColor.rgb, color.rgb, aFixed);
  #else
    vColor = color.rgb;
  #endif`);
    }
  };
  m.customProgramCacheKey = () => (flower ? 'env_flower' : 'env_grass');
  return m;
}

// ---------------------------------------------------------------- textures
function env_grassTexture() {
  const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(S, S);
  const a = new THREE.Color('#6fbf5c'), b = new THREE.Color('#a9dc7a'), c = new THREE.Color();
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const n = env_fbm(x / 32, y / 32, 4, 2, 16);
    c.copy(a).lerp(b, env_ss(0.3, 0.7, n));
    const i = (y * S + x) * 4;
    img.data[i] = c.r * 255; img.data[i + 1] = c.g * 255; img.data[i + 2] = c.b * 255; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const r = env_rng(7);
  for (let i = 0; i < 9000; i++) {
    const x = r() * S, y = r() * S, l = 3 + r() * 7, ang = -Math.PI / 2 + (r() - 0.5) * 0.8;
    const g = 120 + r() * 100;
    ctx.strokeStyle = `rgba(${70 + r() * 70},${g},${60 + r() * 40},${0.25 + r() * 0.35})`;
    ctx.lineWidth = 1 + r();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * l, y + Math.sin(ang) * l); ctx.stroke();
  }
  const fl = ['#ffffff', '#ffd1e3', '#fff3a6', '#e5d0ff'];
  for (let i = 0; i < 260; i++) {
    ctx.fillStyle = fl[i % 4];
    ctx.beginPath(); ctx.arc(r() * S, r() * S, 1.2 + r() * 1.6, 0, 7); ctx.fill();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function env_barkTexture() {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 256;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#b58468'; ctx.fillRect(0, 0, 128, 256);
  const r = env_rng(3);
  for (let i = 0; i < 160; i++) {
    const x = r() * 128; ctx.strokeStyle = r() < 0.5 ? 'rgba(120,80,60,0.35)' : 'rgba(225,180,150,0.3)';
    ctx.lineWidth = 1 + r() * 3; ctx.beginPath(); ctx.moveTo(x, 0);
    ctx.bezierCurveTo(x + (r() - 0.5) * 12, 80, x + (r() - 0.5) * 12, 170, x + (r() - 0.5) * 8, 256); ctx.stroke();
  }
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function env_wingTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const grd = ctx.createRadialGradient(10, 64, 4, 10, 64, 120);
  grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.55, '#f2f2f2'); grd.addColorStop(1, '#b8b8b8');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(56, 40, 54, 36, -0.35, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(44, 92, 38, 28, 0.45, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(78, 34, 9, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(52, 98, 7, 0, 7); ctx.fill();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---------------------------------------------------------------- sky
const env_skyVS = /* glsl */`
varying vec3 vDir;
void main(){
  vDir = position;
  vec4 wp = vec4(cameraPosition + position * 5.0, 1.0);
  gl_Position = projectionMatrix * viewMatrix * wp;
  gl_Position.z = gl_Position.w * 0.99999;
}`;
const env_skyFS = /* glsl */`
uniform vec3 uZenith, uMid, uHorizon, uGlow, uSunCol, uGround;
uniform vec3 uSunDir, uRbDir;
uniform float uGlowAmt, uRainbow, uSunVis;
varying vec3 vDir;
vec3 env_hue(float h){ return clamp(abs(mod(h*6.0+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.); }
void main(){
  vec3 d = normalize(vDir);
  float e = d.y, eh = max(e, 0.0);
  vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.32, eh));
  col = mix(col, uZenith, smoothstep(0.2, 0.95, eh));
  float sd = dot(d, uSunDir);
  vec2 hz = normalize(d.xz + 1e-5), sz = normalize(uSunDir.xz + 1e-5);
  float az = max(dot(hz, sz), 0.0);
  col += uGlow * (pow(az, 2.0) * exp(-eh * 5.0) * uGlowAmt + pow(max(sd,0.), 6.) * 0.35 * uSunVis + pow(max(sd,0.), 80.) * 0.9 * uSunVis);
  col += uSunCol * smoothstep(0.99965, 0.99985, sd) * 9.0 * uSunVis;
  // rainbow
  if (uRainbow > 0.001) {
    float ang = acos(clamp(dot(d, uRbDir), -1., 1.));
    float x = (ang - 0.50) / 0.055;
    float band = smoothstep(1.0, 0.75, abs(x));
    vec3 rb = mix(env_hue(clamp(0.5 - x*0.38, 0.0, 0.82)), vec3(1.0), 0.3);
    col = mix(col, col*0.6 + rb*0.85, band * uRainbow * 0.55 * smoothstep(0.0, 0.08, e));
  }
  col = mix(col, uGround, smoothstep(0.0, -0.06, e));
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453) - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

// ---------------------------------------------------------------- main
function createEnvironment(renderer, scene) {
  const env_root = new THREE.Group(); env_root.name = 'environment';
  scene.add(env_root);
  const R = env_rng(1234);

  // ---------- palettes (display-referred targets -> pre-tonemap linear)
  const P = {
    zenith: env_pal3('#79bdf0', '#8f8fd8', '#262a66', env_ac),
    mid: env_pal3('#b7dcf6', '#e6a9cc', '#6a5aa0', env_ac),
    horizon: env_pal3('#f2ecf2', '#ffcfa6', '#c48ab6', env_ac),
    glow: env_pal3('#fff3d6', '#ff9a5c', '#ff8f8f', (h) => env_ac(h, 0.6)),
    ground: env_pal3('#cfe3d4', '#e8b9a6', '#7a5f88', env_ac),
    sunCol: env_pal3('#fff6e8', '#ffb070', '#ff9a90', env_lin),
    cloudTop: env_pal3('#ffffff', '#ffe0c8', '#d99ac0', (h) => env_ac(h, 0.97)),
    cloudBot: env_pal3('#d9e2f6', '#c5a3d4', '#5a5292', env_ac),
    mount: env_pal3('#a9c4e4', '#c69ac2', '#5e4f8e', env_ac),
    mount2: env_pal3('#93c7c6', '#b591b6', '#4f4a80', env_ac),
    // lights (linear)
    sunL: env_pal3('#fff1dc', '#ffb27a', '#b4b8ee', env_lin),
    hemiSky: env_pal3('#cfe6ff', '#ffc9c0', '#9a9ad8', env_lin),
    hemiGnd: env_pal3('#b8d98f', '#d2b48c', '#5c6a70', env_lin),
    fill: env_pal3('#e3ecff', '#d9c2ff', '#8e8cff', env_lin),
    rim: env_pal3('#fff6ea', '#ffc6a8', '#ff9ed8', env_lin),
  };
  const tmpC = new THREE.Color();

  // ---------- sky dome (always at far plane, independent of camera far)
  const skyU = {
    uZenith: { value: new THREE.Color() }, uMid: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
    uGlow: { value: new THREE.Color() }, uSunCol: { value: new THREE.Color() }, uGround: { value: new THREE.Color() },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uRbDir: { value: new THREE.Vector3(0, -0.36, -1).normalize() },
    uGlowAmt: { value: 0.3 }, uRainbow: { value: 0 }, uSunVis: { value: 1 },
  };
  const skyMat = new THREE.ShaderMaterial({ uniforms: skyU, vertexShader: env_skyVS, fragmentShader: env_skyFS, side: THREE.BackSide, depthWrite: false, fog: false });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32), skyMat);
  sky.frustumCulled = false; sky.renderOrder = -1000;
  env_root.add(sky);

  scene.fog = new THREE.Fog(0xffffff, 14, 300);

  // ---------- lights
  const sun = new THREE.DirectionalLight(0xffffff, 3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 9, bottom: -9, near: 1, far: 80 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.025;
  sun.target.position.set(0, 0, 0);
  scene.add(sun); scene.add(sun.target);
  const hemi = new THREE.HemisphereLight(0xcfe6ff, 0xb8d98f, 1.0); scene.add(hemi);
  const fill = new THREE.DirectionalLight(0xe3ecff, 0.5); fill.position.set(-8, 5, 10); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xfff6ea, 1.2); rim.position.set(-3, 6, -10); scene.add(rim);

  // ---------- ground
  const grassTex = env_grassTexture();
  {
    const N = 220, E = 280;
    const g = new THREE.PlaneGeometry(2, 2, N, N); g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, uv = g.attributes.uv, col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      const u = p.getX(i), w = p.getZ(i);
      const x = E * (0.25 * u + 0.75 * u * u * u), z = E * (0.25 * w + 0.75 * w * w * w);
      const h = env_height(x, z);
      p.setXYZ(i, x, h, z); uv.setXY(i, x / 5, -z / 5);
      const n = env_fbm(x * 0.04, z * 0.04, 3, 21);
      const m = env_fbm(x * 0.012 + 4, z * 0.012, 2, 33);
      tmpC.setRGB(0.92 + 0.16 * n, 1.0, 0.85 + 0.25 * m);
      col[i * 3] = tmpC.r * (0.9 + 0.1 * n); col[i * 3 + 1] = tmpC.g * (0.95 + 0.08 * m); col[i * 3 + 2] = tmpC.b * 0.95;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.computeVertexNormals();
    const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: grassTex, vertexColors: true, roughness: 0.95, color: 0xd8ffc8 }));
    ground.receiveShadow = true;
    env_root.add(ground);
  }

  // ---------- distant hills (soft domes) + mountain silhouettes
  {
    const hillGeo = new THREE.SphereGeometry(1, 64, 24, 0, Math.PI * 2, 0, Math.PI / 2);
    const hills = [
      [-30, -42, 24, 6.5, '#8fd07e'], [20, -48, 28, 7.5, '#9ad88a'], [50, -36, 18, 5, '#86c97c'], [-58, -30, 20, 6, '#8fcf86'],
      [-60, -82, 38, 12, '#8ccf98'], [2, -92, 42, 11, '#96d5a2'], [55, -86, 36, 13, '#8acb9c'],
      [-100, -130, 52, 17, '#97cdb2'], [-25, -145, 58, 15, '#9fd2ba'], [45, -140, 52, 18, '#94cab4'], [115, -125, 52, 16, '#9bcfb8'],
      [-80, 10, 30, 9, '#8fcf86'], [85, 0, 32, 10, '#8fcf86'], [-60, 70, 40, 12, '#94d08c'], [70, 80, 40, 12, '#94d08c'],
    ];
    for (const [x, z, r, h, c] of hills) {
      const m = new THREE.Mesh(hillGeo, new THREE.MeshStandardMaterial({ color: c, map: grassTex, roughness: 1 }));
      m.scale.set(r, h * 0.7, r * 0.7); m.position.set(x, env_height(x, z) - 1.2, z);
      m.receiveShadow = false;
      env_root.add(m);
    }
  }
  const mountMats = [];
  function env_mountRing(radius, base, amp, seed, which) {
    const S = 360, pos = [], uvs = [], idx = [];
    for (let i = 0; i <= S; i++) {
      const a = (i / S) * Math.PI * 2;
      const n = env_fbm(i / S * 14, seed, 4, seed, 14);
      const h = base + amp * Math.pow(n, 1.6) * 2.2;
      const x = Math.sin(a) * radius, z = -Math.cos(a) * radius;
      pos.push(x, -8, z, x, h, z); uvs.push(i / S, 0, i / S, 1);
      if (i < S) { const k = i * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uCol: { value: new THREE.Color() }, uHaze: { value: new THREE.Color() } },
      vertexShader: 'varying float vY; void main(){ vY = position.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
      fragmentShader: `uniform vec3 uCol, uHaze; varying float vY; void main(){ vec3 c = mix(uHaze, uCol, smoothstep(-2.0, 30.0, vY)); gl_FragColor = vec4(c,1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`, side: THREE.DoubleSide, fog: false,
    });
    mat.userData.which = which;
    mountMats.push(mat);
    const m = new THREE.Mesh(g, mat); m.frustumCulled = false; env_root.add(m);
  }
  env_mountRing(250, 6, 16, 4, 'mount');
  env_mountRing(205, 3, 9, 9, 'mount2');

  // ---------- clouds
  const cloudU = {
    uSunDir: skyU.uSunDir, uTop: { value: new THREE.Color() }, uBot: { value: new THREE.Color() },
    uSunCol: { value: new THREE.Color() }, uHaze: skyU.uHorizon,
  };
  const cloudMat = new THREE.ShaderMaterial({
    uniforms: cloudU, vertexColors: true, fog: false,
    vertexShader: `varying vec3 vN, vWP, vAO; void main(){ vec4 wp = modelMatrix*vec4(position,1.); vWP = wp.xyz; vN = normalize(mat3(modelMatrix)*normal); vAO = color; gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `uniform vec3 uSunDir, uTop, uBot, uSunCol, uHaze; varying vec3 vN, vWP, vAO;
    void main(){
      vec3 n = normalize(vN), v = normalize(cameraPosition - vWP);
      vec3 base = mix(uBot, uTop, smoothstep(-0.35, 0.75, n.y));
      float diff = dot(n, normalize(uSunDir + vec3(0.,0.3,0.))) * 0.5 + 0.5;
      vec3 col = base * (0.78 + 0.32 * diff);
      col *= mix(0.82, 1.0, vAO.r);
      float fr = pow(1.0 - max(dot(n, v), 0.0), 2.2);
      col = mix(col, uHaze * 1.05, fr * 0.5);
      col += uSunCol * fr * pow(max(dot(-v, uSunDir), 0.0), 3.0) * 0.5;
      float dist = length(vWP - cameraPosition);
      col = mix(col, uHaze, smoothstep(150.0, 420.0, dist) * 0.55);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  });
  const clouds = [];
  {
    const cloudGeos = [];
    for (let v = 0; v < 4; v++) {
      const r = env_rng(50 + v), lobes = [[0, 0, 0, 1]];
      const n = 7 + v * 2;
      for (let i = 0; i < n; i++) {
        const x = (r() - 0.5) * 3.4, z = (r() - 0.5) * 1.2;
        const rr = 0.55 + r() * 0.55 * (1 - Math.abs(x) / 2.4);
        lobes.push([x, rr * 0.55 + r() * 0.3, z, rr]);
      }
      lobes.push([0.4, 0.8, 0, 0.85]);
      cloudGeos.push(env_puff(lobes, 22, 5, { flat: -0.15, creaseW: 0.3 }));
    }
    const spots = [[-150, 40, -230, 26], [-60, 52, -260, 32], [40, 34, -210, 24], [140, 46, -240, 30], [230, 38, -200, 22],
      [-260, 44, -180, 28], [-20, 70, -300, 30], [100, 75, -330, 34], [-120, 62, -150, 18], [190, 58, -120, 20],
      [-200, 50, 60, 26], [200, 50, 80, 26], [0, 55, 220, 30], [-90, 80, -60, 16], [80, 85, -40, 18]];
    spots.forEach(([x, y, z, s], i) => {
      const m = new THREE.Mesh(cloudGeos[i % 4], cloudMat);
      m.scale.set(s, s * 0.8, s); m.position.set(x, y, z); m.rotation.y = (i * 1.7) % 3;
      m.userData.x0 = x; m.userData.speed = 0.6 + (i % 3) * 0.35;
      clouds.push(m); env_root.add(m);
    });
  }

  // ---------- trees
  const barkTex = env_barkTexture();
  const trunkMat = new THREE.MeshPhysicalMaterial({ color: 0xc89c84, map: barkTex, roughness: 0.85, sheen: 0.4, sheenColor: new THREE.Color('#ffd9c4') });
  const mintMat = new THREE.MeshPhysicalMaterial({ color: '#8fdcaa', vertexColors: true, roughness: 0.8, sheen: 1, sheenRoughness: 0.55, sheenColor: new THREE.Color('#e4ffd8') });
  const pinkMat = new THREE.MeshPhysicalMaterial({ color: '#ffb8d2', vertexColors: true, roughness: 0.75, sheen: 1, sheenRoughness: 0.5, sheenColor: new THREE.Color('#fff0f6') });
  const canopyGeos = [];
  for (let v = 0; v < 4; v++) {
    const r = env_rng(300 + v), lobes = [[0, 0, 0, 1.05]];
    for (let i = 0; i < 9; i++) {
      const a = r() * Math.PI * 2, el = -0.2 + r() * 1.2;
      const rr = 0.55 + r() * 0.35;
      lobes.push([Math.cos(a) * Math.cos(el) * 0.85, Math.sin(el) * 0.75, Math.sin(a) * Math.cos(el) * 0.85, rr]);
    }
    canopyGeos.push(env_puff(lobes, 26, 7, { lump: 0.06, speck: v % 2 ? 0.0 : 0.0, creaseW: 0.25 }));
  }
  const blossomGeos = canopyGeos.map((g, v) => {
    const c = g.clone(); const col = c.attributes.color, p = c.attributes.position;
    for (let i = 0; i < col.count; i++) {
      const n = env_noise3(p.getX(i) * 7, p.getY(i) * 7, p.getZ(i) * 7, 40 + v);
      const k = env_ss(0.55, 0.75, n) * 0.18;
      col.setXYZ(i, col.getX(i) * (1 + k), col.getY(i) * (1 + k * 1.3), col.getZ(i) * (1 + k * 1.1));
    }
    return c;
  });
  function env_trunkGeo(H, rad, bend) {
    const pts = [[1.6, 0], [1.15, 0.12], [1.0, 0.35], [0.86, 0.9], [0.78, H * 0.6], [0.7, H]].map(([r, y]) => new THREE.Vector2(r * rad, y));
    const g = new THREE.LatheGeometry(pts, 28);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setX(i, p.getX(i) + bend * (y / H) * (y / H)); }
    g.computeVertexNormals();
    const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 3, uv.getY(i) * H * 0.5);
    return g;
  }
  function env_tree(x, z, s, pink, v) {
    const grp = new THREE.Group();
    const H = 2.4, bend = (env_hash2(x * 10, z * 10, 1) - 0.5) * 0.6;
    const trunk = new THREE.Mesh(env_trunkGeo(H, 0.24, bend), trunkMat);
    trunk.castShadow = true; trunk.receiveShadow = true; grp.add(trunk);
    const can = new THREE.Mesh(pink ? blossomGeos[v % 4] : canopyGeos[v % 4], pink ? pinkMat : mintMat);
    can.position.set(bend, H + 1.0, 0); can.scale.setScalar(1.75);
    can.rotation.y = v * 1.3;
    can.castShadow = true; can.receiveShadow = true; grp.add(can);
    grp.position.set(x, env_height(x, z) - 0.05, z); grp.scale.setScalar(s); grp.rotation.y = x * 0.7;
    env_root.add(grp);
    return grp;
  }
  const treeSpots = [
    [-10.5, -6, 1.05, 0], [-13.5, -12, 0.95, 1], [-8.8, -17, 0.8, 1], [-16, -4, 1.1, 0], [-12, 1.5, 0.95, 1],
    [10.8, -7, 1.05, 1], [13.6, -2.5, 1.0, 0], [11.5, -15, 0.85, 0], [16.5, -10, 1.1, 1], [12.5, 3, 0.9, 0],
    [-5.5, -30, 0.8, 1], [7.5, -34, 0.85, 0], [-13, -25, 1.0, 0], [17, -21, 1.0, 1], [0.5, -33, 1.1, 1], [-22, -16, 1.2, 1],
    [23, -14, 1.2, 0], [-8, -38, 1.1, 0], [12, -36, 1.0, 1], [-14, 8, 1.0, 0], [15, 9, 1.0, 1],
  ];
  treeSpots.forEach(([x, z, s, pk], i) => env_tree(x, z, s, !!pk, i));

  // distant instanced trees
  {
    const geoC = env_puff([[0, 0, 0, 1], [0.6, 0.2, 0, 0.7], [-0.6, 0.15, 0.2, 0.7], [0, 0.6, 0, 0.7]], 8, 6);
    geoC.translate(0, 2.6, 0); geoC.scale(1.3, 1.3, 1.3);
    const trunkG = new THREE.CylinderGeometry(0.22, 0.32, 2.8, 8); trunkG.translate(0, 1.4, 0);
    const tg = trunkG.toNonIndexed(); tg.deleteAttribute('uv');
    const cc = new Float32Array(tg.attributes.position.count * 3).fill(0.35);
    for (let i = 0; i < cc.length; i += 3) { cc[i] = 0.62; cc[i + 1] = 0.44; cc[i + 2] = 0.36; }
    tg.setAttribute('color', new THREE.BufferAttribute(cc, 3));
    const cg = geoC.toNonIndexed(); cg.deleteAttribute('uv');
    const merged = mergeGeometries([tg, cg]);
    const N = 140;
    const im = new THREE.InstancedMesh(merged, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 }), N);
    const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), ps = new THREE.Vector3();
    const r = env_rng(77); let k = 0;
    while (k < N) {
      const a = (r() - 0.5) * Math.PI * 1.6, d = 40 + r() * 110;
      const x = Math.sin(a) * d * 1.3, z = -Math.cos(a) * d + 10;
      if (Math.abs(x) < 20 && z > -35) continue;
      const s = 1.2 + r() * 1.6;
      ps.set(x, env_height(x, z) - 0.2, z); q.setFromEuler(new THREE.Euler(0, r() * 6, 0)); sc.setScalar(s);
      mtx.compose(ps, q, sc); im.setMatrixAt(k, mtx);
      im.setColorAt(k, tmpC.set(r() < 0.45 ? '#ffc0d8' : (r() < 0.5 ? '#9fe0b0' : '#b8e89a')));
      k++;
    }
    im.castShadow = false; im.receiveShadow = false;
    env_root.add(im);
  }

  // ---------- grass
  {
    const blades = [];
    const r = env_rng(9);
    for (let b = 0; b < 5; b++) {
      const segs = 3, w = 0.075 + r() * 0.03, h = 0.65 + r() * 0.35;
      const ox = (r() - 0.5) * 0.35, oz = (r() - 0.5) * 0.35, yaw = r() * Math.PI, bendAmt = 0.15 + r() * 0.25;
      const pos = [], col = [], nrm = [];
      for (let s = 0; s <= segs; s++) {
        const t = s / segs, y = t * h, ww = w * (1 - t * 0.92) * 0.5, off = bendAmt * t * t;
        for (const side of [-1, 1]) {
          const lx = side * ww, lz = off;
          pos.push(ox + lx * Math.cos(yaw) - lz * Math.sin(yaw), y, oz + lx * Math.sin(yaw) + lz * Math.cos(yaw));
          const c = 0.32 + 0.62 * Math.pow(t, 1.1);
          col.push(c * 0.95, c, c * 0.85); nrm.push(0, 1, 0);
        }
      }
      const idx = [];
      for (let s = 0; s < segs; s++) { const k = s * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setIndex(idx); blades.push(g);
    }
    const clump = mergeGeometries(blades);
    const mat = env_windMaterial({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide }, false);
    const pts = [];
    const add = (n, x0, x1, z0, z1, sMul) => {
      for (let i = 0; i < n; i++) {
        const x = x0 + r() * (x1 - x0), z = z0 + r() * (z1 - z0);
        let s = (0.24 + r() * 0.16) * sMul;
        const inAct = Math.abs(x) < 6.5 && Math.abs(z) < 3.5;
        if (inAct) { if (r() < 0.3) continue; s *= 0.72; }
        const patch = env_fbm(x * 0.25, z * 0.25, 2, 61);
        s *= 0.8 + patch * 0.5;
        pts.push([x, z, s]);
      }
    };
    add(16000, -11, 11, -9, 8, 1);
    add(9000, -26, 26, -30, -9, 1.5);
    add(3000, -26, -11, -9, 10, 1.4);
    add(3000, 11, 26, -9, 10, 1.4);

  table.visible = ts > .001; table.position.copy(TABLE_POS); table.scale.setScalar(Math.max(ts, .001));
  cart.updateMatrixWorld(true); table.updateMatrixWorld(true);
  placeItems(t);
  if (bush.rustle) bush.rustle(win(t, 5.6, 6.8) || win(t, 7.9, 9) ? 1 : 0);
  dizzy.visible = win(t, 18.4, 21.2); if (dizzy.visible) { dizzy.position.copy(wp(K.anchors.headTop)).add(V(0, .25, 0)); dizzy.update?.(t); }
  bigHeart.visible = t > 119.8; if (bigHeart.visible) {
    const u = clamp((t - 119.8) / .6), el = 1 + Math.sin(u * 9) * Math.exp(-u * 4) * .3;
    bigHeart.position.copy(trio()).add(V(0, 2.95 + .05 * Math.sin(t * 3), 0)); bigHeart.scale.setScalar(2.8 * sm(u) * el * (1 + .05 * Math.sin(t * 6))); bigHeart.rotation.y = Math.sin(t * 1.5) * .4;
  }
  for (const [c, f] of SPARK) if (c > lastT && c <= t) sparkles.burst(f(), { count: 26 });
  const ch = chorus(t);
  if (ch !== null) for (const b of BEATS) if (b > lastT && b <= t && Math.round((b - ch) / .627) % 3 === 0) sparkles.burst(V((Math.random() - .5) * 4, 2 + Math.random(), CZ + (Math.random() - .5) * 2), { count: 14 });
  floaters.setActive(ch !== null || win(t, 117, 124)); floaters.update(t, dt, V(0, 1, CZ));
  confetti.setActive(win(t, CH2, CH2 + 14.5)); confetti.update(t, dt, V(0, 0, CZ));
  sparkles.update(dt);
  const sunset = tr(t, [[110, 0], [116, .55], [123.5, .7]]);
  env.update(t, dt, { sunset, beat: ch !== null ? beat(t) : 0, wind: 1 });
  env.setRainbow?.(Math.max(sm((t - 28) / 2) * (1 - sm((t - 39) / 2)), sm((t - CH2 - 1) / 2) * (1 - sm((t - CH2 - 13) / 1.5))));
  grade.uniforms.time.value = t; grade.uniforms.warm.value = sunset;

  directCamera(t, dt);
  composer.render(dt);
  updateOverlays(t, spk);
  lastT = t;
}

// ================= overlays =================
const bK = document.getElementById('bK'), bM = document.getElementById('bM'), bC = document.getElementById('bC'), narr = document.getElementById('narr'), theEnd = document.getElementById('theEnd'), fade = document.getElementById('fade');
function bubble(el, rig, id) {
  if (!id) { el.classList.remove('show'); return; }
  const p = wp(rig.anchors.headTop).add(V(0, .55, 0)).project(camera);
  if (p.z > 1 || Math.abs(p.x) > 1.15 || p.y > 1.4) { el.classList.remove('show'); return; } // speaker off-screen
  if (el.textContent !== LINES[id]) el.textContent = LINES[id];
  const minY = el.offsetHeight / stage.clientHeight * 100 + 2;
  const x = clamp((p.x * .5 + .5) * 100, 20, 80), y = clamp((-p.y * .5 + .5) * 100, minY, 90);
  el.style.left = x + '%'; el.style.top = y + '%';
  if (el.textContent !== LINES[id]) el.textContent = LINES[id];
  el.classList.add('show');
}
function updateOverlays(t, spk) {
  const w = who(spk);
  bubble(bK, K, w === 'k' ? spk : null); bubble(bM, M, w === 'm' ? spk : null); bubble(bC, C, w === 'c' ? spk : null);
  const n = w === 'n' ? spk : null; if (n && narr.textContent !== LINES[n]) narr.textContent = LINES[n]; narr.classList.toggle('show', !!n);
  theEnd.style.opacity = sm((t - 122) / 1); fade.style.opacity = sm((t - 124.6) / 1.6);
}

// ================= audio & loop =================
// Web Audio engine: the song, voices and sfx are scheduled sample-accurately against ONE clock (AudioContext),
// and the animation reads its time from that same clock => picture and sound can't drift apart.
// Falls back to <audio> elements when fetch() is unavailable (file://).
const ACtx = window.AudioContext || window.webkitAudioContext;
const actx = ACtx ? new ACtx() : null;
const BUF = {};
const AUDIO_IDS = ['song2', ...new Set(VOICE.map(v => v[0])), ...new Set(SFX.map(s => s[0]))];
let audioReady = false, useWebAudio = !!actx;
const overlay = document.getElementById('overlay'), playBtn = document.getElementById('play');
async function loadAudio() {
  if (!useWebAudio) { audioReady = true; enablePlay(); return; }
  const get = async id => {
    const r = await fetch(AUDIO + id + '.mp3'); if (!r.ok) throw new Error(id);
    const ab = await r.arrayBuffer();
    BUF[id] = await new Promise((res, rej) => actx.decodeAudioData(ab, res, rej));
    DUR[id] = BUF[id].duration;
    if (playing && id !== 'song2') scheduleCue(id); // arrived after Play: slot it into the running schedule
  };
  try { await get('song2'); } catch (e) { console.warn('web audio unavailable, falling back', e); useWebAudio = false; }
  audioReady = true; enablePlay();
  if (useWebAudio) for (const id of AUDIO_IDS.slice(1)) { try { await get(id); } catch (e) { console.warn('missing', id); } }
}
function enablePlay() { playBtn.disabled = false; if (playBtn.dataset.wait) playBtn.textContent = '▶ Play!'; }
playBtn.disabled = true; playBtn.dataset.wait = 1; playBtn.textContent = 'Loading…';
loadAudio();

// --- web audio scheduling ---
let songGain, voiceGain, sfxGain, sources = [], t0 = 0;
function schedule() {
  for (const s of sources) { try { s.stop(); } catch (e) { } } sources = [];
  songGain = actx.createGain(); voiceGain = actx.createGain(); sfxGain = actx.createGain();
  songGain.connect(actx.destination); voiceGain.connect(actx.destination); sfxGain.connect(actx.destination);
  voiceGain.gain.value = voicesOn ? 1 : 0; sfxGain.gain.value = .55;
  t0 = actx.currentTime + .15;
  const g = songGain.gain; g.setValueAtTime(.85, t0);
  playBuf('song2', 0, songGain);
  for (const id of new Set([...VOICE.map(v => v[0]), ...SFX.map(x => x[0])])) if (BUF[id]) scheduleCue(id);
}
function playBuf(id, at, gain) {
  const when = t0 + at; if (when < actx.currentTime + .01) return; // already passed
  const s = actx.createBufferSource(); s.buffer = BUF[id]; s.connect(gain); s.start(when); sources.push(s);
}
function scheduleCue(id) {
  for (const [vid, c] of VOICE) if (vid === id) {
    playBuf(id, c, voiceGain);
    if (voicesOn && t0 + c > actx.currentTime) { const g = songGain.gain; g.setTargetAtTime(.4, t0 + c - .1, .08); g.setTargetAtTime(.85, t0 + c + DUR[id] + .1, .25); }
  }
  for (const [sid, c] of SFX) if (sid === id) playBuf(id, c, sfxGain);
}
function waClock() {
  const ts = actx.getOutputTimestamp ? actx.getOutputTimestamp() : null;
  let ct = actx.currentTime;
  if (ts && ts.contextTime > 0 && actx.state === 'running') ct = ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
  return ct - t0;
}

// --- <audio> fallback ---
const A = f => { const a = new Audio(AUDIO + f + '.mp3'); a.preload = 'auto'; return a; };
let song = null; const voices = {}, sfx = {};
function initFallback() {
  if (song) return; song = A('song2');
  for (const [id] of VOICE) voices[id] = A(id);
  for (const [id] of SFX) if (!sfx[id]) sfx[id] = [A(id), A(id)];
}
let fbClock0 = null, fbPrev = 0, sfxFlip = 0;
function fbClock() {
  if (fbClock0 === null) { if (song.currentTime > 0 && !song.paused) fbClock0 = performance.now() - song.currentTime * 1000; else return 0; }
  let t = (performance.now() - fbClock0) / 1000;
  const err = song.currentTime - t; // slew gently toward the song instead of jumping
  if (!song.paused && song.currentTime > 0) { if (Math.abs(err) > .3) fbClock0 = performance.now() - song.currentTime * 1000; else fbClock0 -= err * 1000 * .03; }
  return (performance.now() - fbClock0) / 1000;
}
function fbFire(prev, t) {
  if (t - prev > 1 || t < prev) return;
  if (voicesOn) for (const [id, c] of VOICE) if (c > prev && c <= t) { const v = voices[id]; v.currentTime = 0; v.play().catch(() => { }); }
  for (const [id, c] of SFX) if (c > prev && c <= t) { const s = sfx[id][sfxFlip ^= 1]; s.currentTime = 0; s.volume = .55; s.play().catch(() => { }); }
}

// --- transport ---
let playing = false, paused = false, pausedAt = 0;
function now() {
  if (paused) return pausedAt;
  return useWebAudio ? waClock() : fbClock();
}
function start() {
  overlay.classList.add('hidden'); lastT = -.01; paused = false; playing = true; pauseBtn.textContent = '⏸ Pause';
  camState.shot = -1;
  if (useWebAudio) { actx.resume(); schedule(); }
  else {
    initFallback(); for (const v of Object.values(voices)) v.pause();
    // unlock all elements inside the user gesture (iOS)
    for (const a of [...Object.values(voices), ...Object.values(sfx).flat()]) { a.muted = true; a.play().then(() => { a.pause(); a.muted = false; }).catch(() => { }); }
    song.currentTime = 0; fbClock0 = null; fbPrev = 0; song.play().catch(() => { });
  }
}
function showOverlay(label) { playBtn.textContent = label; delete playBtn.dataset.wait; overlay.classList.remove('hidden'); if (useWebAudio) { for (const s of sources) { try { s.stop(); } catch (e) { } } } else song?.pause(); }
playBtn.onclick = () => { if (audioReady) start(); };
document.getElementById('restart').onclick = () => { if (audioReady) start(); };
const pauseBtn = document.getElementById('pause');
pauseBtn.onclick = () => {
  if (!playing) return;
  if (!paused) {
    pausedAt = now(); paused = true; pauseBtn.textContent = '▶ Resume';
    if (useWebAudio) actx.suspend(); else { song.pause(); for (const v of Object.values(voices)) v.pause(); }
  } else {
    paused = false; pauseBtn.textContent = '⏸ Pause';
    if (useWebAudio) actx.resume(); else { song.currentTime = pausedAt; fbClock0 = performance.now() - pausedAt * 1000; song.play(); }
  }
};
document.getElementById('voices').onchange = e => { voicesOn = e.target.checked; if (useWebAudio && voiceGain) voiceGain.gain.setTargetAtTime(voicesOn ? 1 : 0, actx.currentTime, .05); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); overlay.classList.contains('hidden') ? pauseBtn.click() : (audioReady && start()); } });

// --- adaptive quality: keep motion smooth on slower devices ---
let ftAvg = 16, qLevel = 0, qTimer = 0;
function adaptQuality(dtMs) {
  ftAvg += (dtMs - ftAvg) * .05; qTimer += dtMs;
  if (qTimer > 2500 && ftAvg > 24 && qLevel < 3) {
    qLevel++; qTimer = 0;
    if (qLevel === 1) { renderer.setPixelRatio(1); resize(); }
    if (qLevel === 2) { bokeh.enabled = false; }
    if (qLevel === 3) { renderer.setPixelRatio(.75); resize(); bloom.enabled = false; }
    console.log('quality level', qLevel, 'avg frame ms', ftAvg.toFixed(1));
  }
}

window.__cartoon = { now: () => now(), info: () => ({ ctx: actx && actx.state, web: useWebAudio, sources: sources.length, q: qLevel, ft: +ftAvg.toFixed(1), loaded: Object.keys(BUF).length }) };
let prevWall = performance.now(), idleDrawn = -1e9;
function loop() {
  const wall = performance.now(), dtMs = wall - prevWall, dt = Math.min(.05, dtMs / 1000); prevWall = wall;
  if (playing && !paused) adaptQuality(dtMs);
  let t;
  if (playing) {
    t = Math.max(0, now());
    if (!useWebAudio && !paused) { fbFire(fbPrev, t); fbPrev = t; }
    if (t >= END) { playing = false; showOverlay('▶ Play again!'); }
  } else t = 3.0;
  if (playing || wall - idleDrawn > 400) { frame(t, paused ? 0 : dt); if (!playing) idleDrawn = wall; } // idle title screen: redraw rarely so loading stays fast
  requestAnimationFrame(loop);
}

if (params.has('analyze')) {
  overlay.style.display = 'none';
  const rows = []; const dt = 1 / 30;
  for (let t = 0; t < END; t += dt) {
    const ks = stateK(t), ms = stateM(t), cs = stateC(t);
    K.root.position.set(ks.x, ks.y, ks.z); K.root.rotation.y = ks.rot; M.root.position.set(ms.x, ms.y, ms.z); M.root.rotation.y = ms.rot;
    C.root.position.copy(cs.pos); C.root.rotation.y = cs.rot; C.root.visible = cs.vis;
    K.update(t, dt, ks.pose); M.update(t, dt, ms.pose); C.update(t, dt, cs.pose);
    K.root.updateMatrixWorld(true); M.root.updateMatrixWorld(true); C.root.updateMatrixWorld(true);
    let shot = 0; while (shot < SHOTS.length - 1 && t >= SHOTS[shot + 1][0]) shot++;
    const look = directCamera(t, dt);
    const f = v => [+v.x.toFixed(3), +v.y.toFixed(3), +v.z.toFixed(3)];
    rows.push({ t: +t.toFixed(3), shot, cam: f(camera.position), look: f(look), fov: camera.fov, K: [ks.x, ks.y, ks.z, ks.rot].map(x => +x.toFixed(3)), M: [ms.x, ms.y, ms.z, ms.rot].map(x => +x.toFixed(3)), C: [...f(cs.pos), +cs.rot.toFixed(3)], kh: f(wp(K.anchors.headTop)), mh: f(wp(M.anchors.headTop)) });
  }
  const pre = document.createElement('pre'); pre.id = 'out'; pre.textContent = JSON.stringify(rows); document.body.appendChild(pre); document.title = 'analyzed';
} else if (STILL !== null) {
  overlay.style.display = 'none';
  const t0 = Math.max(0, STILL - 2.5);
  for (let t = t0; t < STILL; t += 1 / 30) { lastT = t - 1 / 30; frameSim(t); }
  frame(STILL, 1 / 30); document.title = 'ready';
  const again = () => { composer.render(1 / 60); requestAnimationFrame(again); }; requestAnimationFrame(again);
} else { requestAnimationFrame(loop); }
function frameSim(t) { // cheap simulation step (no render) to settle springs before a still
  const ks = stateK(t), ms = stateM(t);
  K.root.position.set(ks.x, ks.y, ks.z); K.root.rotation.y = ks.rot; M.root.position.set(ms.x, ms.y, ms.z); M.root.rotation.y = ms.rot;
  K.update(t, 1 / 30, ks.pose); M.update(t, 1 / 30, ms.pose);
  const cs = stateC(t); C.root.position.copy(cs.pos); C.root.rotation.y = cs.rot; C.update(t, 1 / 30, cs.pose);
}

</script>
